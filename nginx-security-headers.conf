# ══════════════════════════════════════════════════════════════════════════════
# nginx-security-headers.conf
# ══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE
# -------
# Belt-and-suspenders security headers for the Nginx layer on the EC2 instance.
# Express/Helmet already sets these headers on API responses.
# This snippet ensures they are ALSO present on any static files Nginx serves
# directly (e.g. the React dist/ folder) and on Nginx error pages.
#
# Additionally, this file now includes production-grade Cache-Control directives
# that are essential for correct PWA behavior after every deployment.
#
# HOW TO USE
# ----------
# 1. SSH into your EC2 instance.
# 2. Open your Nginx site config:
#      sudo nano /etc/nginx/sites-available/lifeawakening.conf
#    or:
#      sudo nano /etc/nginx/conf.d/lifeawakening.conf
# 3. Merge the location blocks and server-level directives from below into your
#    existing server { ... } block, following the inline comments.
# 4. Test config:  sudo nginx -t
# 5. Reload:       sudo systemctl reload nginx
#
# IMPORTANT — what NOT to modify in your existing Nginx config:
#   - proxy_pass / reverse proxy directives
#   - SSL certificate paths (ssl_certificate, ssl_certificate_key)
#   - gzip / compression settings
#   - Any existing location blocks not listed here
# ══════════════════════════════════════════════════════════════════════════════


# ── SECTION 1: Security Headers ───────────────────────────────────────────────
# Paste these lines INSIDE your server { } block, OUTSIDE any location blocks.
# ─────────────────────────────────────────────────────────────────────────────

    # Hide Nginx version from Server: response header
    server_tokens off;

    # Allow uploading videos and media up to 200MB (essential for 2-min video uploads)
    client_max_body_size 200M;

    # ── Content-Security-Policy ────────────────────────────────────────────────
    # Keep in sync with the CSP in backend/server.js
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://life-awakening-media-2026.s3.ap-south-1.amazonaws.com https://life-awakening-media-2026.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; media-src 'self' data: blob: https: https://life-awakening-media-2026.s3.ap-south-1.amazonaws.com https://life-awakening-media-2026.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; connect-src 'self' https://life-awakening-media-2026.s3.ap-south-1.amazonaws.com https://life-awakening-media-2026.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:*; frame-src 'self' https://docs.google.com; child-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://docs.google.com;" always;

    # ── HTTP Strict Transport Security ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Clickjacking protection ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── MIME-type sniffing protection ─────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;

    # ── Referrer Policy ───────────────────────────────────────────────────────
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Permissions Policy ────────────────────────────────────────────────────
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# ── SECTION 2: Cache-Control Directives ───────────────────────────────────────
#
# WHY THESE RULES ARE CRITICAL FOR PWA CORRECTNESS
# -------------------------------------------------
# Without explicit Cache-Control, browsers apply heuristic caching to
# everything. For a PWA, this causes two dangerous failure modes:
#
#  (A) sw.js is cached by the browser's HTTP cache → the browser never sees
#      the updated sw.js → new deployments are invisible to existing users.
#
#  (B) index.html is cached by the browser's HTTP cache → the old HTML
#      references old JS/CSS chunk hashes → blank screen after deployment.
#
# RULES BY RESOURCE TYPE
# ──────────────────────
#
#  sw.js          → no-cache, no-store  (MUST be fetched fresh every single time)
#  index.html     → no-cache, no-store  (MUST be fetched fresh for every navigation)
#  manifest.json  → no-cache            (browsers must see icon/color changes)
#  /assets/*      → immutable, 1 year   (Vite content-hash: filename changes = new file)
#  /uploads/*     → 1 day              (user-uploaded content)
#  images (/public/*.png etc.) → 7 days (static images, rarely change)
#  /fonts/*       → 1 year immutable   (static fonts, never change)
#
# ─────────────────────────────────────────────────────────────────────────────
# Paste the following location blocks INSIDE your server { } block.
# These are ADDITIVE — they do not replace your existing proxy_pass or other
# location blocks. Add them alongside your existing configuration.
# ─────────────────────────────────────────────────────────────────────────────

    # ── Service Worker: NEVER cache ──────────────────────────────────────────
    # The browser fetches sw.js on every page load to detect updates.
    # If the HTTP cache returns a stale sw.js, new deployments are invisible.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        # Re-apply security headers (Nginx does not inherit add_header into sub-locations
        # unless they are repeated here or set in the parent server block without any
        # location-level add_header in that location).
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── HTML entry point: NEVER cache ────────────────────────────────────────
    # index.html references hashed JS/CSS filenames. If the old HTML is cached,
    # the browser tries to load old chunk filenames that no longer exist after
    # a new deployment → blank screen or JavaScript errors.
    # CRITICAL: Nginx wipes out parent add_header directives if any add_header is
    # defined in a location block. We re-declare Content-Security-Policy with media-src
    # so that blob: videos, fonts, and images are never blocked.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://life-awakening-media-2026.s3.ap-south-1.amazonaws.com https://life-awakening-media-2026.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; media-src 'self' data: blob: https: https://life-awakening-media-2026.s3.ap-south-1.amazonaws.com https://life-awakening-media-2026.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; connect-src 'self' https://life-awakening-media-2026.s3.ap-south-1.amazonaws.com https://life-awakening-media-2026.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:*; frame-src 'self' https://docs.google.com; child-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://docs.google.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Web App Manifest: short-lived cache ──────────────────────────────────
    # Allows browsers to detect icon, theme color, and display mode changes
    # within minutes rather than the default heuristic cache duration.
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        expires 0;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Vite hashed JS/CSS bundles: immutable for 1 year ────────────────────
    # Vite appends a content hash to every JS and CSS filename (e.g.,
    # react-vendor.abc12345.js). If the content changes, the filename changes,
    # so browsers will always fetch the new file. The old files can be cached
    # indefinitely — they will never be served for changed content.
    # "immutable" tells modern browsers to never even send a conditional request.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── User-uploaded files (proxy directly to Express backend port 5001) ───
    # Journey media, RI documents, certificates, feedback videos, etc.
    location /uploads/ {
        proxy_pass http://localhost:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location /api/uploads/ {
        proxy_pass http://localhost:5001/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Static public images ─────────────────────────────────────────────────
    # Logos, icons, pillar images. 7-day cache; revalidated if stale.
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    }

    # ── Web fonts (self-hosted) ───────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

# ── End of Cache-Control additions ───────────────────────────────────────────


